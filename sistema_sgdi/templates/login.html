{% extends "base.html" %}

{% block title %}Entrar - SGDI{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="form-card login-card">
        <div class="login-header">
            <h1><span>🔐</span> Acesso ao SGDI</h1>
            <p>Entre com seu e-mail e senha. Todas as ações realizadas no sistema ficam registradas na trilha de auditoria.</p>
        </div>

        <form method="POST" action="/login" id="form-login">
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" required autofocus autocomplete="username" value="{{ email }}" placeholder="seu.nome@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary login-btn" id="btn-entrar">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
